<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltSchool Africa - Application Form</title>
</head>

<body>

    <!-- Global Navigation -->
    <header id="top">
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a> |
            <a href="form.html">Application Form</a>
        </nav>
    </header>

    <main>
        <h1>Apply to AltSchool Africa</h1>

        <p>
            Join AltSchool Africa and begin your journey into technology.
            Complete the form below to apply.
        </p>

        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="first-name">First Name:</label><br>
                <input type="text" id="first-name" name="first_name"
                       placeholder="Enter your first name" required>
                <br><br>

                <label for="last-name">Last Name:</label><br>
                <input type="text" id="last-name" name="last_name"
                       placeholder="Enter your last name" required>
                <br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
                <br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number" required>
                <br><br>

                <label for="date-of-birth">Password</label><br>
                <input type="password" id="date-of-birth"
                       name="password" required>
                <br><br>

            
            <br>
            <footer>
            <button type="submit">Create account</button>
                <br>
                <p>or</p>
                <br>

            <button type="reset">login with Google </button>
            </footer>
        </form>

        <p>
            <a href="#top">Back to Top</a>
        </p>
    </main>



</body>
</html>
